spring:
  application:
    name: TripTrackerApplication

  datasource:
    url: jdbc:mysql://localhost:3306/trip_tracker
    username: root
    password: ${DB_PASSWORD:test}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      name: root
      password: ${APP_PASSWORD:test}

app:
  jwt:
    secret: ${JWT_SECRET:7f3a9c2e8b1d6f405a7e9c3b2d8f1a6e4c0b7d9f2a5e8c1b6d3f0a9e7c4b2d51}
    expiration-ms: 86400000

server:
  port: 8801